flex-direction: column;

#str_alarm {

}

#str_chapter {

font-size: 2rem;
color: gray;
}

#t_all {
flex-grow: 1;
display: flex;
flex-direction: row;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
}

#t_main {

margin: 1rem;
color: gray;
font-size: 12rem;

font-weight: 500;
}

#gr_C {

.t_add_class {

.icon {

.t_add_val {
